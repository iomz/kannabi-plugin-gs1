name: checks

# The plugin is source built with Kannabi, so it is checked the only way it
# runs: inside a Kannabi checkout, at plugins/gs1, named by that checkout's
# plugin list. Kannabi's own CI never names a plugin, so a change in core that
# breaks this one is found here, by the scheduled run against core's main.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      core-ref:
        description: The Kannabi branch, tag or commit to check against
        default: main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: ${{ inputs.core-ref || 'main' }}

jobs:
  # Kannabi's required checks, with this plugin composed in. The unit tests are
  # core's, against its fixture, and then this plugin's, under its own
  # composition.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: iomz/kannabi
          ref: ${{ env.CORE_REF }}
      - uses: actions/checkout@v5
        with:
          path: plugins/gs1
      - name: List this plugin alone
        run: echo '{"plugins":[{"id":"gs1"}]}' > kannabi.plugins.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Only this plugin's integration suites: core's run in Kannabi's own CI, and
  # against its fixture rather than any installed plugin.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: iomz/kannabi
          ref: ${{ env.CORE_REF }}
      - uses: actions/checkout@v5
        with:
          path: plugins/gs1
      - name: List this plugin alone
        run: echo '{"plugins":[{"id":"gs1"}]}' > kannabi.plugins.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull the images the harness starts before any suite runs, retrying, so
      # a slow registry on the runner fails here as a pull rather than midway
      # through the suites as a test failure.
      - name: Pull test images
        run: |
          for image in neo4j:5-community ghcr.io/achtungsoftware/alarik:1.0.0-beta-16; do
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 15))
            done
          done
      - name: Run this plugin's integration suites
        run: |
          pnpm -s plugins:compose
          find plugins/gs1 -name '*.integration.test.ts' -not -path '*/node_modules/*' -print0 \
            | sort -z | xargs -0 node scripts/test-identity.mjs
